[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lambda-duplex"
dynamic = ["version"]
description = "A framework for benchmarking how full-duplex voice models converse."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6",
]

[project.scripts]
lambda-duplex = "lambda_duplex.cli:main"

[project.optional-dependencies]
audio = [
    "numpy>=2",
    "onnxruntime>=1.20",
    "soundfile>=0.13",
    "soxr>=0.5",
]
transcribe = ["lambda-duplex[audio]", "faster-whisper>=1.2"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "numpy>=2",
    "onnxruntime>=1.20",
    "pytest>=8.3",
    "ruff>=0.8",
    "soundfile>=0.13",
    "soxr>=0.5",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.hatch.version]
path = "src/lambda_duplex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lambda_duplex"]

[tool.hatch.build.targets.wheel.force-include]
"suites/_template" = "lambda_duplex/_suite_template"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not local'"
markers = ["local: needs local models or hardware"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.md"]
line-length = 100
src = ["src", "tests", "."]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
files = ["src", "tests", "suites", "scripts"]
mypy_path = "src:."
explicit_package_bases = true
python_version = "3.12"
strict = true
