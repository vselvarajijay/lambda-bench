name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run python scripts/check_agents.py
      - run: uv run lambda-duplex doctor
      - run: uv run lambda-duplex adapter-check mock
      - name: Scaffold and run a new suite
        run: |
          uv run lambda-duplex new-suite ci_suite --out "$RUNNER_TEMP/ci_suite"
          uv run lambda-duplex suites validate "$RUNNER_TEMP/ci_suite"
          uv run lambda-duplex run --suite "$RUNNER_TEMP/ci_suite" --model mock --mode text
